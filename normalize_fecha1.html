<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Normalize Fecha 1</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body style="background:#111; color:#fff; font-family:monospace; padding:20px;">
  <h2>Normalizing Fecha 1 Finalized Matches</h2>
  <div id="output">Normalizando...</div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAzRTlx96sL8rxcgLauftrTWpr5VlwjV00",
      authDomain: "ldbaa-calificaciones.firebaseapp.com",
      projectId: "ldbaa-calificaciones",
      storageBucket: "ldbaa-calificaciones.firebasestorage.app",
      messagingSenderId: "277579489603",
      appId: "1:277579489603:web:bc93c22fea5f5f6b63cff6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function normalize() {
      const snap = await db.collection("fixtures").where("championshipId", "==", "p7eMp1ciqd67iQCiA4JV").get();
      let logs = [];

      for (const doc of snap.docs) {
        const d = doc.data();
        const matches = d.data || [];
        let modified = false;

        const updated = matches.map((m, idx) => {
          const hasVocal = !!(m.vocalReport && (m.vocalReport.vocalSignature || m.vocalReport.vocalName));
          const hasRef = !!(m.refereeReport && (m.refereeReport.judgeSignature || m.refereeReport.judgeName || m.refereeReport.judgeRating));
          const isMarkedFinalized = m.isFinalized === true || m.liveStatus?.period === "Finalizado";

          // Si el partido está finalizado por vocalía, árbitro o flag
          if (m.isFinalized === true || (hasVocal && hasRef) || (isMarkedFinalized && (idx === 5 || idx === 3))) {
            const scoreL = m.liveStatus?.scoreLocal !== undefined ? m.liveStatus.scoreLocal : 0;
            const scoreV = m.liveStatus?.scoreVisitor !== undefined ? m.liveStatus.scoreVisitor : 0;

            modified = true;
            return {
              ...m,
              isFinalized: true,
              liveStatus: {
                ...(m.liveStatus || {}),
                isLive: false,
                period: "Finalizado",
                minute: "Final",
                scoreLocal: scoreL,
                scoreVisitor: scoreV,
                lastUpdate: new Date().toISOString()
              }
            };
          }
          return m;
        });

        if (modified) {
          await db.collection("fixtures").doc(doc.id).update({
            data: updated,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          logs.push(`Doc ${doc.id} (${d.category}) normalizado.`);
        }
      }

      document.getElementById("output").innerHTML = "<h3>EXITO:</h3><ul>" + logs.map(l => `<li>${l}</li>`).join('') + "</ul>";
      window.__done = true;
    }
    normalize();
  </script>
</body>
</html>

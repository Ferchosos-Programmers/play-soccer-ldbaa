<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - Plataforma Deportiva LDBAA</title>
    
    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <link rel="icon" href="img/logo.png" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/global-theme.css" />
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/global-swal-patch.js"></script>
  </head>
  <body>
    <!-- Persistent Background -->
    <div class="main-bg"></div>

    <div class="login-box">
      <!-- Logo as Brand Accent -->
      <img src="img/logo.png" alt="LDBAA Logo" class="login-logo" onerror="this.style.display='none'">
      
      <h2>Acceso al Sistema</h2>
      
      <form id="loginForm">
        <div class="mb-4">
          <label for="email" class="form-label">Correo Electrónico</label>
          <div class="input-group">
            <input 
                type="email" 
                class="form-control" 
                id="email" 
                placeholder="nombre@ejemplo.com"
                required 
            />
          </div>
        </div>
        
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <input 
                type="password" 
                class="form-control" 
                id="password" 
                placeholder="••••••••"
                required 
            />
          </div>
        </div>

        <button type="submit" class="btn btn-green w-100">
           <i class="fa-solid fa-right-to-bracket me-2"></i> Iniciar Sesión
        </button>
      </form>

      <!-- Elegant Return Link -->
      <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Regresar al Inicio</span>
      </a>
      
      <div class="mt-4 text-center">
        <small class="text-white-50">LDBAA &copy; 2024 - Argelia Alta</small>
      </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAzRTlx96sL8rxcgLauftrTWpr5VlwjV00",
        authDomain: "ldbaa-calificaciones.firebaseapp.com",
        projectId: "ldbaa-calificaciones",
        storageBucket: "ldbaa-calificaciones.firebasestorage.app",
        messagingSenderId: "277579489603",
        appId: "1:277579489603:web:01a1cc9ee1c9538163cff6",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const loginForm = document.getElementById("loginForm");

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        
        // Show loading state
        Swal.fire({
          title: 'Verificando...',
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          }
        });

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        signInWithEmailAndPassword(auth, email, password)
          .then(async (userCredential) => {
            // Check if it's admin@gmail.com
            if (email === "admin@gmail.com") {
              window.location.href = "super-admin.html";
              return;
            }

            // Check in Firestore users collection
            try {
              const userQuery = await firebase.firestore().collection("users").where("email", "==", email).get();
              if (!userQuery.empty) {
                const userData = userQuery.docs[0].data();
                if (userData.password === password) {
                  // Direct redirection based on assigned roles
                  Swal.fire({
                    icon: "success",
                    title: "¡Bienvenido!",
                    text: "Redirigiendo según sus permisos...",
                    timer: 1500,
                    showConfirmButton: false
                  }).then(() => {
                    if (userData.roles.sanciones) {
                      window.location.href = "sanciones.html";
                    } else if (userData.roles.programacion) {
                      window.location.href = "programacion-dashboard.html";
                    } else if (userData.roles.tesorero) {
                      window.location.href = "tesorero-dashboard.html";
                    } else if (userData.roles.dashboard) {
                      window.location.href = "dashboard.html";
                    } else {
                      window.location.href = "index.html";
                    }
                  });
                  return;
                } else {
                  // If password in Firestore doesn't match, reject access
                  Swal.fire({
                    icon: "error",
                    title: "Contraseña incorrecta",
                    text: "Por favor verifique la clave asignada por el Administrador.",
                    confirmButtonColor: "#e74c3c"
                  });
                  return;
                }
              }
            } catch (err) {
              console.error("Firestore user check failed, falling back to basic flow:", err);
            }

            // Fallback default redirections
            Swal.fire({
              icon: "success",
              title: "¡Bienvenido!",
              text: "Autenticación exitosa. Redirigiendo...",
              timer: 1500,
              showConfirmButton: false
            }).then(() => {
              if (email === "programacion@gmail.com") {
                window.location.href = "programacion-dashboard.html";
              } else if (email === "sanciones@gmail.com") {
                window.location.href = "sanciones.html";
              } else if (email === "tesorero@gmail.com") {
                window.location.href = "tesorero-dashboard.html";
              } else if (email.endsWith("@ldbaa.com")) {
                window.location.href = "team-dashboard.html";
              } else {
                window.location.href = "dashboard.html";
              }
            });
          })
          .catch((error) => {
            Swal.fire({
              icon: "error",
              title: "Acceso Denegado",
              text: "Las credenciales no coinciden con nuestros registros.",
              confirmButtonColor: "#2ecc71"
            });
          });
      });
    </script>
  </body>
</html>

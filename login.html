<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - Plataforma Deportiva LDBAA</title>
    
    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <link rel="icon" href="img/logo.png" />

    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LDBAA" />
    <link rel="apple-touch-icon" href="img/logo.png" />

    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/global-theme.css" />
    
    <!-- SweetAlert2 & PWA -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/global-swal-patch.js"></script>
    <script src="js/pwa-installer.js"></script>
  </head>
  <body>
    <!-- Persistent Background -->
    <div class="main-bg"></div>

    <div class="login-box">
      <!-- Logo as Brand Accent -->
      <img src="img/logo.png" alt="LDBAA Logo" class="login-logo" onerror="this.style.display='none'">
      
      <h2>Acceso al Sistema</h2>
      
      <form id="loginForm">
        <div class="mb-4">
          <label for="email" class="form-label">Correo Electrónico</label>
          <div class="input-group">
            <input 
                type="email" 
                class="form-control" 
                id="email" 
                placeholder="nombre@ejemplo.com"
                required 
            />
          </div>
        </div>
        
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <input 
                type="password" 
                class="form-control" 
                id="password" 
                placeholder="••••••••"
                required 
            />
          </div>
        </div>

        <button type="submit" class="btn btn-green w-100">
           <i class="fa-solid fa-right-to-bracket me-2"></i> Iniciar Sesión
        </button>
      </form>

      <!-- Elegant Return Link -->
      <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Regresar al Inicio</span>
      </a>
      
      <div class="mt-4 text-center">
        <small class="text-white-50">LDBAA &copy; 2024 - Argelia Alta</small>
      </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        updatePassword,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import {
        getFirestore,
        collection,
        query,
        where,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAzRTlx96sL8rxcgLauftrTWpr5VlwjV00",
        authDomain: "ldbaa-calificaciones.firebaseapp.com",
        projectId: "ldbaa-calificaciones",
        storageBucket: "ldbaa-calificaciones.firebasestorage.app",
        messagingSenderId: "277579489603",
        appId: "1:277579489603:web:01a1cc9ee1c9538163cff6",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const loginForm = document.getElementById("loginForm");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        // Show loading state
        Swal.fire({
          title: "Verificando...",
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          },
        });

        const email = (document.getElementById("email").value || "")
          .trim()
          .toLowerCase();
        const password = (
          document.getElementById("password").value || ""
        ).trim();

        let userCredential = null;

        // 1. Intentar inicio de sesión directo con Firebase Auth
        try {
          userCredential = await signInWithEmailAndPassword(
            auth,
            email,
            password,
          );
        } catch (authErr) {
          console.warn(
            "Intento Auth directo no coincidió:",
            authErr.code || authErr.message,
          );

          // 2. Si es correo de equipo (@ldbaa.com), verificar contra la base de datos Firestore de equipos
          if (email.endsWith("@ldbaa.com")) {
            try {
              const teamQ = query(
                collection(db, "teams"),
                where("email", "==", email),
              );
              const teamSnap = await getDocs(teamQ);
              if (!teamSnap.empty) {
                const teamData = teamSnap.docs[0].data();
                const expectedPass = teamData.adminKey || teamData.password;
                if (
                  expectedPass &&
                  String(expectedPass).trim() === String(password).trim()
                ) {
                  // La contraseña coincide con la asignada en Firestore!
                  // Sincronizar en Firebase Auth para completar el acceso
                  try {
                    userCredential = await createUserWithEmailAndPassword(
                      auth,
                      email,
                      password,
                    );
                  } catch (createErr) {
                    if (createErr.code === "auth/email-already-in-use") {
                      const cleanName = (teamData.name || "")
                        .toLowerCase()
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, "")
                        .replace(/[^a-z0-9]/g, "");
                      const catSuffix = teamData.category
                        ? `.${teamData.category.toLowerCase().replace(/[^a-z0-9]/g, "")}`
                        : "";
                      const currentYear = new Date().getFullYear();
                      const candidates = [
                        `${cleanName}${catSuffix}${currentYear}`,
                        `${cleanName}${currentYear}`,
                        `${cleanName}${catSuffix}`,
                        `${cleanName}`,
                        "123456",
                      ];
                      for (const cPass of candidates) {
                        try {
                          const oldCred = await signInWithEmailAndPassword(
                            auth,
                            email,
                            cPass,
                          );
                          await updatePassword(oldCred.user, password);
                          userCredential = oldCred;
                          break;
                        } catch (eCand) {}
                      }
                    }
                  }
                }
              }
            } catch (fsErr) {
              console.warn("Error sincronizando equipo con Firestore:", fsErr);
            }
          }

          // 3. Si es usuario de la colección 'users', verificar si la contraseña coincide
          if (!userCredential) {
            try {
              const uQ = query(
                collection(db, "users"),
                where("email", "==", email),
              );
              const uSnap = await getDocs(uQ);
              if (!uSnap.empty) {
                const uData = uSnap.docs[0].data();
                if (
                  uData.password &&
                  String(uData.password).trim() === String(password).trim()
                ) {
                  try {
                    userCredential = await createUserWithEmailAndPassword(
                      auth,
                      email,
                      password,
                    );
                  } catch (eCu) {
                    if (eCu.code === "auth/email-already-in-use") {
                      try {
                        const oldCred = await signInWithEmailAndPassword(
                          auth,
                          email,
                          uData.password,
                        );
                        userCredential = oldCred;
                      } catch (eOld) {}
                    }
                  }
                }
              }
            } catch (uErr) {
              console.warn("Error en colección users:", uErr);
            }
          }
        }

        // Si no se pudo autenticar en ninguna vía:
        if (!userCredential) {
          Swal.fire({
            icon: "error",
            title: "Acceso Denegado",
            text: "Las credenciales no coinciden con nuestros registros.",
            confirmButtonColor: "#2ecc71",
          });
          return;
        }

        // Redirección especial para super-admin
        if (email === "admin@gmail.com") {
          window.location.href = "super-admin.html";
          return;
        }

        // Verificar roles en colección 'users'
        try {
          const userQuery = await getDocs(
            query(collection(db, "users"), where("email", "==", email)),
          );
          if (!userQuery.empty) {
            const userData = userQuery.docs[0].data();
            Swal.fire({
              icon: "success",
              title: "¡Bienvenido!",
              text: "Redirigiendo según sus permisos...",
              timer: 1500,
              showConfirmButton: false,
            }).then(() => {
              if (userData.roles?.sanciones) {
                window.location.href = "sanciones.html";
              } else if (userData.roles?.programacion) {
                window.location.href = "programacion-dashboard.html";
              } else if (userData.roles?.tesorero) {
                window.location.href = "tesorero-dashboard.html";
              } else if (userData.roles?.dashboard) {
                window.location.href = "dashboard.html";
              } else {
                window.location.href = "index.html";
              }
            });
            return;
          }
        } catch (err) {
          console.error("Firestore user check failed:", err);
        }

        // Redirección por defecto
        Swal.fire({
          icon: "success",
          title: "¡Bienvenido!",
          text: "Autenticación exitosa. Redirigiendo...",
          timer: 1500,
          showConfirmButton: false,
        }).then(() => {
          if (email === "programacion@gmail.com") {
            window.location.href = "programacion-dashboard.html";
          } else if (email === "sanciones@gmail.com") {
            window.location.href = "sanciones.html";
          } else if (email === "tesorero@gmail.com") {
            window.location.href = "tesorero-dashboard.html";
          } else if (email.endsWith("@ldbaa.com")) {
            window.location.href = "team-dashboard.html";
          } else {
            window.location.href = "dashboard.html";
          }
        });
      });
    </script>
  </body>
</html>

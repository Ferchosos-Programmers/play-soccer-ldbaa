<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Equipos del Campeonato | Liga Barrial LDBAA</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="icon" href="img/logo.png" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/carnetizacion.css" />
    <link rel="stylesheet" href="css/global-theme.css" />

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/global-swal-patch.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
  </head>
  <body>
    <!-- Persistent Background -->
    <div class="main-bg"></div>

    <!-- Navigation -->
    <nav class="nav-premium shadow-sm">
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <a class="navbar-brand text-white" href="index.html">
          <img src="img/logo.png" alt="Logo" width="35" height="35" />
          <span
            >LIGA BARRIAL <span class="brand-accent">ARGELIA ALTA</span></span
          >
        </a>
        <a href="carnetizacion.html" class="btn-back">
          <i class="fas fa-arrow-left"></i>
          <span class="d-none d-md-inline">Regresar a Campeonatos</span>
        </a>
      </div>
    </nav>

    <div class="container pb-5">
      <!-- Dynamic Title -->
      <div class="text-center">
        <h2 class="section-title" id="championshipTitle">
          🏆 Equipos del Campeonato
        </h2>
        <p class="text-white-50 mb-4">
          Gestiona la carnetización y recalificación de los equipos
          participantes.
        </p>
      </div>

      <!-- Enhanced Filters Grid -->
      <div class="filter-grid">
        <div class="input-group-premium">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Buscar por nombre del equipo..."
            oninput="filterTeams()"
          />
        </div>

        <div class="position-relative">
          <select
            id="categoryFilter"
            class="select-premium"
            onchange="filterTeams()"
          >
            <option value="">Todas las categorías</option>
            <option value="MÁXIMA">MÁXIMA</option>
            <option value="PRIMERA">PRIMERA</option>
            <option value="FEMENINO">FEMENINO</option>
          </select>
        </div>
      </div>

      <!-- Teams Grid -->
      <div class="championship-grid" id="teamsContainer">
        <!-- Spinner while loading -->
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const teamsContainer = document.getElementById("teamsContainer");
      const searchInput = document.getElementById("searchInput");
      const categoryFilter = document.getElementById("categoryFilter");
      const championshipTitle = document.getElementById("championshipTitle");
      let allTeams = [];
      let carnetizacionFinalizada = false;

      // Obtener parámetros de la URL
      const urlParams = new URLSearchParams(window.location.search);
      const championshipId = urlParams.get("championshipId");
      const championshipName = urlParams.get("championshipName");

      // Actualizar título
      if (championshipName) {
        championshipTitle.textContent = `🏆 ${decodeURIComponent(championshipName)}`;
      }

      const firebaseConfig = {
        apiKey: "AIzaSyAzRTlx96sL8rxcgLauftrTWpr5VlwjV00",
        authDomain: "ldbaa-calificaciones.firebaseapp.com",
        projectId: "ldbaa-calificaciones",
        storageBucket: "ldbaa-calificaciones.firebasestorage.app",
        messagingSenderId: "277579489603",
        appId: "1:277579489603:web:bc93c22fea5f5f6b63cff6",
      };

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        mostrarCuentaRegresiva().then(() => {
          loadTeams();
        });

        function mostrarCuentaRegresiva() {
          return new Promise((resolve) => {
            if (!championshipId) {
              resolve();
              return;
            }

            db.collection("championships")
              .doc(championshipId)
              .get()
              .then((doc) => {
                if (!doc.exists) {
                  resolve();
                  return;
                }

                const championshipData = doc.data();
                const deadline = new Date(
                  championshipData.deadline || `${new Date().getFullYear()}-12-31T23:59:00`,
                ).getTime();

                const countdownDiv = document.createElement("div");
                countdownDiv.className = "text-center py-3";

                const interval = setInterval(() => {
                  const now = new Date().getTime();
                  const distance = deadline - now;

                  if (distance < 0) {
                    clearInterval(interval);
                    countdownDiv.innerHTML = `
              <div class="text-danger fw-bold fs-5" style="font-family: 'Times New Roman', Times, serif;">
                <i class="fas fa-ban me-2"></i>
                ${championshipData.expiredMessage || "La fecha de carnetización ha terminado."}
              </div>`;
                    carnetizacionFinalizada = true;
                    resolve();
                    return;
                  }

                  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                  const hours = Math.floor(
                    (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
                  );
                  const minutes = Math.floor(
                    (distance % (1000 * 60 * 60)) / (1000 * 60),
                  );
                  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                  countdownDiv.innerHTML = `
            <div class="mb-3 text-muted">
              ${championshipData.countdownMessage || "Tiempo restante para completar la carnetización:"}
            </div>
            <div class="fs-2 fw-bold text-success">
              ${days}d ${hours}h ${minutes}m ${seconds}s
            </div>
          `;
                }, 1000);

                Swal.fire({
                  title: `<div class="brand-accent fs-3 fw-bold" style="font-family: 'Times New Roman', Times, serif;">
                    RELOJ DE CARNETIZACIÓN
                  </div>`,
                  html: countdownDiv,

                  showCancelButton: true,
                  showConfirmButton: true,
                  showDenyButton: false, // 🔥 clave

                  confirmButtonText: "Entrar al Campeonato",
                  cancelButtonText: "Cancelar",
                  denyButtonText: null, // 🔥 evita que aparezca "No"

                  allowOutsideClick: false,
                  buttonsStyling: false,

                  customClass: {
                    confirmButton: "btn btn-enter px-4 py-2",
                    cancelButton: "btn btn-outline-light px-4 py-2",
                    popup: "glass-popup rounded-4",
                  },

                  didOpen: () => {
                    // 🔥 eliminar botón deny si SweetAlert lo genera igual
                    const denyBtn = document.querySelector(".swal2-deny");
                    if (denyBtn) denyBtn.remove();

                    const style = document.createElement("style");
                    style.innerHTML = `
              .glass-popup { 
                background: rgba(10,10,10,0.98) !important; 
                border: 1px solid rgba(255,255,255,0.1) !important; 
                color: white !important; 
                backdrop-filter: blur(20px); 
                font-family: 'Times New Roman', Times, serif !important;
              }
              .btn-enter {
                background: linear-gradient(135deg, #2ecc71, #27ae60) !important;
                color: white !important;
                border: none !important;
                font-weight: bold !important;
                transition: all 0.3s ease;
              }
              .btn-enter:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
              }
            `;
                    document.head.appendChild(style);
                  },
                }).then((result) => {
                  clearInterval(interval);

                  if (result.isConfirmed) {
                    resolve();
                  } else {
                    window.location.href = "index.html";
                  }
                });
              })
              .catch((error) => {
                console.error(
                  "Error al cargar información del campeonato:",
                  error,
                );
                resolve();
              });
          });
        }
        function loadTeams() {
          if (!championshipId) {
            teamsContainer.innerHTML =
              '<div class="col-12 text-center py-5"><p class="text-danger">Error: No se especificó el campeonato.</p></div>';
            return;
          }

          db.collection("teams")
            .where("championshipId", "==", championshipId)
            .get()
            .then((querySnapshot) => {
              teamsContainer.innerHTML = "";
              allTeams = [];

              if (querySnapshot.empty) {
                teamsContainer.innerHTML =
                  '<div class="col-12 text-center py-5"><p class="text-white-50">No hay equipos registrados en este campeonato.</p></div>';
              } else {
                querySnapshot.forEach((doc) => {
                  const teamData = doc.data();
                  teamData.id = doc.id;
                  allTeams.push(teamData);
                });
                displayTeams(allTeams);
              }
            })
            .catch((error) => {
              console.error("Error al cargar equipos:", error);
              Swal.fire("Error", "No se pudieron cargar los equipos.", "error");
            });
        }

        function filterTeams() {
          const searchTerm = searchInput.value.toLowerCase();
          const selectedCategory = categoryFilter.value;

          const filteredTeams = allTeams.filter((team) => {
            const nameMatch = team.name.toLowerCase().includes(searchTerm);
            const categoryMatch =
              selectedCategory === "" || team.category === selectedCategory;
            return nameMatch && categoryMatch;
          });

          displayTeams(filteredTeams);
        }

        function displayTeams(teams) {
          teamsContainer.innerHTML = "";
          if (teams.length === 0) {
            teamsContainer.innerHTML =
              '<div class="col-12 text-center py-5"><p class="text-white-50">No se encontraron equipos que coincidan con los filtros.</p></div>';
          } else {
            teams.forEach((team) => {
              createTeamCard(team);
            });
          }
        }

        function createTeamCard(team) {
          const card = document.createElement("div");
          card.className = "glass-card";
          card.onclick = () => entrarEquipo(team.id, team.name);

          const statusText = carnetizacionFinalizada
            ? '<span class="badge bg-danger mb-2">FINALIZADO</span>'
            : '<span class="badge bg-success mb-2">ACTIVO</span>';

          card.innerHTML = `
              <img src="${team.logo}" class="card-logo" alt="Logo">
              <h3 class="card-name mb-1">${team.name}</h3>
              <p class="text-white-50 small mb-3">${team.category}</p>
              ${statusText}
              <button class="btn-enter mt-3">
                <i class="fas fa-sign-in-alt me-2"></i> ${carnetizacionFinalizada ? "Ver Planilla" : "Gestionar"}
              </button>
          `;
          teamsContainer.appendChild(card);
        }

        window.entrarEquipo = function (teamId, teamName) {
          if (carnetizacionFinalizada) {
            Swal.fire({
              title:
                "<div style=\"font-family: 'Times New Roman', Times, serif;\">Acceso Administrativo</div>",
              text: "La carnetización está cerrada. Ingrese clave para editar.",
              input: "password",
              inputPlaceholder: "Clave administrativa",
              showCancelButton: true,
              showDenyButton: false,
              confirmButtonText: "Acceder",
              cancelButtonText: "Cancelar",
              denyButtonText: null,
              customClass: {
                popup: "glass-popup",
                confirmButton: "btn btn-enter px-4 py-2",
                cancelButton: "btn btn-outline-light px-4 py-2",
              },
              buttonsStyling: false,
              didOpen: () => {
                const denyBtn = document.querySelector(".swal2-deny");
                if (denyBtn) denyBtn.remove();

                const style = document.createElement("style");
                style.innerHTML = `
                  .swal2-title, .swal2-html-container, .swal2-content, .swal2-input {
                    font-family: 'Times New Roman', Times, serif !important;
                  }
                `;
                document.head.appendChild(style);
              },
              preConfirm: (clave) => {
                if (clave === "admin2025" || clave === "admin2026" || clave === "admin") return true;
                Swal.showValidationMessage("Clave incorrecta");
                return false;
              },
            }).then((result) => {
              if (result.isConfirmed) {
                const champQuery = `${championshipId ? `&championshipId=${championshipId}` : ''}${championshipName ? `&championshipName=${encodeURIComponent(championshipName)}` : ''}`;
                window.location.href = `registro-jugador.html?teamId=${teamId}&mode=register${champQuery}`;
              }
            });
            return;
          }

          Swal.fire({
            title: `<div style="font-family: 'Times New Roman', Times, serif; font-size: 1.8rem; font-weight: 800;">Gestión de Equipo: ${teamName}</div>`,
            html: `<div style="font-family: 'Times New Roman', Times, serif; color: #b3b3b3; margin-top: 10px;">¿Qué acción administrativa desea realizar?</div>`,
            icon: "question",
            showCancelButton: true,
            showDenyButton: true,
            confirmButtonText: "Calificar Nuevo",
            denyButtonText: "Recalificar",
            cancelButtonText: "Cancelar",
            keepDeny: true, // IMPORTANT: Allows the button to show up despite the global patch
            customClass: {
              popup: "glass-popup",
              confirmButton: "swal2-confirm swal2-styled",
              denyButton: "swal2-deny swal2-styled",
              cancelButton: "swal2-cancel swal2-styled",
              actions: "swal2-actions-compact",
            },
            buttonsStyling: false,
            didOpen: () => {
              const popup = Swal.getPopup();
              // Force Times New Roman globally in the modal
              popup.style.fontFamily = "'Times New Roman', Times, serif";

              // Custom style for the buttons to be uniform
              const confirmBtn = popup.querySelector(".swal2-confirm");
              const denyBtn = popup.querySelector(".swal2-deny");
              const cancelBtn = popup.querySelector(".swal2-cancel");

              if (confirmBtn) {
                confirmBtn.style.background =
                  "linear-gradient(135deg, #2ecc71, #27ae60)";
                confirmBtn.style.border = "none";
                confirmBtn.style.borderRadius = "12px";
                confirmBtn.style.padding = "0.8rem 1.5rem";
                confirmBtn.style.margin = "5px";
                confirmBtn.style.color = "white";
              }

              if (denyBtn) {
                denyBtn.style.background =
                  "linear-gradient(135deg, #f1c40f, #f39c12)";
                denyBtn.style.border = "none";
                denyBtn.style.borderRadius = "12px";
                denyBtn.style.padding = "0.8rem 1.5rem";
                denyBtn.style.margin = "5px";
                denyBtn.style.color = "white";
                denyBtn.style.display = "inline-block"; // Force display
              }

              if (cancelBtn) {
                cancelBtn.style.background = "rgba(255, 255, 255, 0.1)";
                cancelBtn.style.border = "1px solid rgba(255, 255, 255, 0.2)";
                cancelBtn.style.borderRadius = "12px";
                cancelBtn.style.padding = "0.8rem 1.5rem";
                cancelBtn.style.margin = "5px";
                cancelBtn.style.color = "white";
              }
            },
          }).then((result) => {
            const champQuery = `${championshipId ? `&championshipId=${championshipId}` : ''}${championshipName ? `&championshipName=${encodeURIComponent(championshipName)}` : ''}`;
            if (result.isConfirmed) {
              window.location.href = `registro-jugador.html?teamId=${teamId}&mode=register${champQuery}`;
            } else if (result.isDenied) {
              window.location.href = `registro-jugador.html?teamId=${teamId}&mode=reclassify${champQuery}`;
            }
          });
        };
      } catch (error) {
        console.error("Error al inicializar:", error);
        Swal.fire("Error", "No se pudo conectar con el servidor.", "error");
      }
    </script>
  </body>
</html>
